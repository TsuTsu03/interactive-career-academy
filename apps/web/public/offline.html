<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#002576" />
    <title>Offline | CodeDaddy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
        background: #f7fafc;
        color: #181c1e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7fafc;
      }

      main {
        width: min(100%, 580px);
        border: 1px solid #b8860b;
        border-radius: 16px;
        padding: clamp(24px, 6vw, 40px);
        background: #ffffff;
      }

      .status {
        margin: 0;
        color: #7a5700;
        font-family: Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 0;
        font-size: clamp(34px, 9vw, 44px);
        line-height: 1.05;
      }

      p:not(.status) {
        margin: 16px 0 0;
        color: #444653;
        font-size: 16px;
        line-height: 1.65;
      }

      @media (prefers-color-scheme: dark) {
        :root,
        body {
          background: #121318;
          color: #f8fafc;
        }

        main {
          border-color: #dca900;
          background: #0f172a;
        }

        .status {
          color: #f6bf22;
        }

        p:not(.status) {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status"><span aria-hidden="true">○</span> Offline</p>
      <h1>This page was not saved yet.</h1>
      <p>
        Reconnect and open the course once. After it finishes loading, you can return to that course without a connection.
      </p>
      <p>
        Courses you already opened remain available. Account sign-in, final project submission, and certificates still need a connection.
      </p>
    </main>
  </body>
</html>
